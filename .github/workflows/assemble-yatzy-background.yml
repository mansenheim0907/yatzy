name: Assemble Yatzy background

on:
  push:
    branches: [develop]
    paths:
      - '.imageparts/**'
      - '.github/workflows/assemble-yatzy-background.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Assemble background image
        run: |
          cat .imageparts/*.txt | tr -d '\n' | base64 --decode > public/yatzy-background.avif
          test "$(wc -c < public/yatzy-background.avif)" -eq 40650
      - name: Commit assembled image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/yatzy-background.avif
          git rm -r .imageparts
          git rm .github/workflows/assemble-yatzy-background.yml
          git commit -m "Add high-resolution Yatzy splash background"
          git push origin develop
